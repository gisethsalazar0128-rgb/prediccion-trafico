# HorizontalPodAutoscaler: agrega o quita pods segun el uso de CPU
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: prediccion-trafico
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prediccion-trafico
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
